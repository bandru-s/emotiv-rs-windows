[package]
name = "emotiv-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "emotiv_bridge"
path = "src/main.rs"

[dependencies]
emotiv = { path = "../../emotiv-rs-0.0.14", version = "=0.0.14", default-features = false, features = ["raw"] }
env_logger = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
